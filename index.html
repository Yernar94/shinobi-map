<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shinobi World Map</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      background-color: #111;
      font-family: Arial, sans-serif;
    }




#map-container {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

#water-layer {
  position: absolute;
  inset: 0;
  background-image: url('/images/Tex_0044_результат.png');
  background-repeat: repeat;
  background-size: 5%;
  z-index: 0;
}

#map {
     position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  aspect-ratio: 2000 / 1200;
  background: transparent;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;

   will-change: transform;
  transform-origin: 0 0;
  backface-visibility: hidden;
  transform-style: preserve-3d;
  pointer-events: auto; /* обязательно! */
  transition: none;
  z-index: 2;
}
#mapView {
  transform-origin: 0 0;
  
}


#svg-map {
  overflow: visible; /* и это */
    transform: scale(0.25);
  transform-origin: top left;
   stroke: gold;           /* цвет линий */
  stroke-width: 4;        /* толщина */
  stroke-linecap: round;  /* скругление концов */
  stroke-linejoin: round; /* скругление углов */
  fill: none;             /* чтобы не заливалось */
  
  
}

    .location {
      position: absolute;
      width: 32px;
      height: 32px;
      background-size: cover;
      cursor: pointer;
      border-radius: 50%;
    }
    .status-peace { animation: pulse-green 2s infinite; }
    .status-war { animation: pulse-red 1.2s infinite; }
    .status-hidden { animation: pulse-blue 2s infinite; }

    @keyframes pulse-green {
      0% { box-shadow: 0 0 5px #0f0; transform: scale(1); }
      50% { box-shadow: 0 0 20px #0f0; transform: scale(1.1); }
      100% { box-shadow: 0 0 5px #0f0; transform: scale(1); }
    }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 5px #f00; transform: scale(1); }
      50% { box-shadow: 0 0 20px #f00; transform: scale(1.15); }
      100% { box-shadow: 0 0 5px #f00; transform: scale(1); }
    }
    @keyframes pulse-blue {
      0% { box-shadow: 0 0 5px #09f; transform: scale(1); }
      50% { box-shadow: 0 0 20px #09f; transform: scale(1.1); }
      100% { box-shadow: 0 0 5px #09f; transform: scale(1); }
    }

    .tooltip {
      position: absolute; 
      background: rgba(30, 30, 30, 0.95);
      color: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #444;
      z-index: 100;
      min-width: 250px;
      display: none;
    }
    .tooltip h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: #ffc400;
    }
    .tooltip input, .tooltip select, .tooltip textarea {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
      margin-bottom: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .tooltip button {
      margin-top: 5px;
      padding: 6px 10px;
      background: #ffc400;
      color: black;
      border: none;
      cursor: pointer;
      width: 100%;
    }
 .event {

.filter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 38px;
  padding: 0 12px;
  color: white;
  text-shadow: 0 0 3px black;

  background:
  linear-gradient(to right, rgba(27, 27, 58, 0.9), rgba(42, 42, 96, 0.9), rgba(27, 27, 58, 0.9)),
  url('/images/oblako.png');
background-size: cover;
background-repeat: no-repeat, no-repeat;
background-position: center, 100px -55px;
background-blend-mode: overlay;

  border: 1px ridge #ffeebd;
  border-radius: 7px;

  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.5),
    inset 0 0 2px rgba(255, 255, 255, 0.15),
    0 4px 10px rgba(255, 230, 150, 0.2);

  position: relative;
  overflow: hidden;
  transition: all 0.2s ease;
  
  
}

/* Добавим плавный переход цвета */
.filter-header {
  transition: background-color 0.4s ease, filter 0.4s ease, box-shadow 0.4s ease;
}

/* Красный стиль, появится при открытии */
.filter-header.opened {
background:
    linear-gradient(to right, rgba(100, 10, 10, 0.6), rgba(160, 20, 20, 0.6), rgba(100, 10, 10, 0.6)),
    url('/images/oblako.png');
 background-size: cover;
background-repeat: no-repeat, no-repeat;
background-position: center, 100px -55px;
background-blend-mode: overlay;

  filter: brightness(1.1) saturate(1.2);
  
}



/* 🟡 Hover эффект */
.filter-header:hover {
  filter: brightness(1.07);
  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.6),
    inset 0 0 3px rgba(255, 255, 255, 0.25),
    0 6px 14px rgba(255, 240, 180, 0.35);
}

/* 🔵 Активный стиль */
.filter-header.active {
  border-color: #00f0ff;
  box-shadow:
    0 0 0 1px rgba(0, 255, 255, 0.3),
    inset 0 0 4px rgba(0, 255, 255, 0.3),
    0 6px 14px rgba(0, 255, 255, 0.2);
}

/* 🔴 Опасный стиль */
.filter-header.danger {
  border-color: #ff4e4e;
  box-shadow:
    0 0 0 1px rgba(255, 0, 0, 0.3),
    inset 0 0 4px rgba(255, 0, 0, 0.3),
    0 6px 14px rgba(255, 0, 0, 0.2);
}

.cloud-left-2 {
left: -42px;
  top: -28px;
  --base-rotate: 168deg;
  animation: floatCloud 6s ease-in-out infinite;
}

.cloud-left {
  left: -42px;
  top: -30px;
  --base-rotate: 168deg;
  animation: floatCloud 6s ease-in-out infinite;
}

@keyframes floatCloud {
  0% {
    transform: translate(0px, 0px) rotate(var(--base-rotate));
  }
  50% {
    transform: translate(5px, 3px) rotate(calc(var(--base-rotate) + 1deg));
  }
  100% {
    transform: translate(0px, 0px) rotate(var(--base-rotate));
  }
}

.pinned-message-container .chat-message {
  background: transparent;
  font-weight: bold;
}

.pinned-container {
  max-height: 80px;
  overflow: hidden;
  margin: 4px 8px;
  border: 2px solid gold;
  border-radius: 8px;
  background: rgba(255, 255, 0, 0.1);
  padding: 4px;
}

.pinned {
  transform: scale(0.9);
  transform-origin: top left;
}

.pinned .pin-btn {
  display: none; /* не показываем кнопку внутри закрепа */
}
#pinned-message {
  max-height: 60px;
  overflow: hidden;
  margin: 6px;
  padding: 4px 6px;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: none; /* по умолчанию без рамки */
  background: transparent;
}

#pinned-message.has-message {
  border: 2px solid gold;
  border-radius: 8px;
  background: rgba(255, 255, 0, 0.07);
}


.pinned .chat-location {
  font-size: 12px;
  color: #e87;
}
.unpin-btn {
  margin-top: 4px;
  align-self: flex-end;
  background: none;
  border: none;
  color: #f88;
  cursor: pointer;
  font-size: 14px;
}
.unpin-btn:hover {
  color: #fff;
}
@keyframes flashHighlight {
  0% { background-color: rgba(255, 255, 0, 0.3); }
  100% { background-color: transparent; }
}

.chat-message.flash {
  animation: flashHighlight 1.5s ease-out;
}
.chat-notify {
  position: absolute;
  top: -28px;
  left: 0;
  width: 100%;
  padding: 4px 8px;
  background: #ffcc00;
  color: black;
  border-radius: 4px;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  animation: fadeinout 3s ease forwards;
  pointer-events: none;
  z-index: 10;
}
.hidden {
  display: none;
}
@keyframes fadeinout {
  0% { opacity: 0; transform: translateY(-10px); }
  10% { opacity: 1; transform: translateY(0); }
  90% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-10px); }
}
.hidden {
  display: none;
}
.chat-message.editing .quote-btn,
.chat-message.editing .delete-btn,
.chat-message.editing .reaction-popup,
.chat-message.editing .reaction-result,
.chat-message.editing .pin-btn {
  display: none !important;
}

  </style>
</head>

document.addEventListener('wheel', (e) => {
  e.preventDefault();

  const mapWrapper = document.getElementById('mapView');
  const rect = mapWrapper.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  const newScale = Math.min(Math.max(0.5, currentScale + delta), 3);
  const zoomFactor = newScale / currentScale;

  currentTranslateX -= (mouseX) * (zoomFactor - 1);
  currentTranslateY -= (mouseY) * (zoomFactor - 1);

  currentScale = newScale;
  applyTransform();
}, { passive: false });

function positionTooltip(e) {
  const tooltip = document.getElementById('tooltip');
  const tooltipWidth = tooltip.offsetWidth;
  const tooltipHeight = tooltip.offsetHeight;
  const padding = 10;

  let left = e.clientX + padding;
  let top = e.clientY + padding;

  // Если тултип выходит за правый край — сдвигаем влево
  if (left + tooltipWidth > window.innerWidth) {
    left = e.clientX - tooltipWidth - padding;
  }

  // Если тултип выходит за нижний край — сдвигаем вверх
  if (top + tooltipHeight > window.innerHeight) {
    top = e.clientY - tooltipHeight - padding;
  }

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}

function getNearestWeather(x, y) {
  const allLocations = document.querySelectorAll('.location');
  let closest = null;
  let minDist = Infinity;

  allLocations.forEach(loc => {
    const locX = parseFloat(loc.style.left);
    const locY = parseFloat(loc.style.top);
    const dx = locX - x;
    const dy = locY - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist) {
      minDist = dist;
      closest = loc;
    }
  });

  if (closest && closest.title) {
    const match = closest.title.match(/Погода: (.+)/);
    if (match) return match[1];
  }

  return 'Неизвестна';
}

function drawTracks() {
  // Удалим старые линии
  document.querySelectorAll('.track-line').forEach(line => line.remove());

  const now = Date.now();

  playerTracks.forEach(track => {
    // Пропустить треки старше 1 часа
    if (now - track.timestamp > 3600000) return;

    const line = document.createElement('div');
    line.className = 'track-line';
    line.style.position = 'absolute';
    line.style.width = '2px';
    line.style.background = 'rgba(0,255,255,0.5)';
    line.style.zIndex = '1';

    const dx = track.to.x - track.from.x;
    const dy = track.to.y - track.from.y;
    const length = Math.sqrt(dx * dx + dy * dy);

    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    line.style.left = track.from.x + 'px';
    line.style.top = track.from.y + 'px';
    line.style.height = length + 'px';
    line.style.transform = `rotate(${angle}deg)`;
    line.style.transformOrigin = 'top left';

    mapWrapper.appendChild(line);
  });
}

function smoothFollowTo(targetX, targetY) {
  const duration = 500; // длительность в мс
  const steps = 30;     // количество шагов анимации
  let step = 0;

  const startX = offsetX;
  const startY = offsetY;
  const deltaX = targetX - startX;
  const deltaY = targetY - startY;

  const animate = () => {
    step++;
    const t = step / steps;
    offsetX = startX + deltaX * t;
    offsetY = startY + deltaY * t;
    updateTransform();
    if (step < steps) {
      requestAnimationFrame(animate);
    }
  };

  animate();
}

function smoothFollowTo(targetX, targetY) {
  const duration = 800; // миллисекунд
  const startTime = performance.now();
  const startX = offsetX;
  const startY = offsetY;
  const deltaX = targetX - startX;
  const deltaY = targetY - startY;

  function animate(time) {
    const elapsed = time - startTime;
    const progress = Math.min(elapsed / duration, 1); // от 0 до 1

    // easeOutQuad для плавности
    const easedProgress = 1 - Math.pow(1 - progress, 2);

    offsetX = startX + deltaX * easedProgress;
    offsetY = startY + deltaY * easedProgress;

    updateTransform();

    if (progress < 1) {
      requestAnimationFrame(animate);
    }
  }

  requestAnimationFrame(animate);
}
// 🛠 Панель фильтрации (перемещение, сворачивание и сохранение)
const panel = document.getElementById('filter-panel');
const toggleBtn = document.getElementById('toggleFilter');
const resetBtn = document.getElementById('resetFilter');

// 🔄 Сохраняем положение и состояние
function savePanelState() {
  const rect = panel.getBoundingClientRect();
  localStorage.setItem('filterPanelX', rect.left);
  localStorage.setItem('filterPanelY', rect.top);
  localStorage.setItem('filterPanelExpanded', !panel.classList.contains('collapsed'));
}
function adjustFilterDirection() {
  const panelRect = panel.getBoundingClientRect();
  const body = panel.querySelector('.filter-body');

  if (!body) return;

  const isNearBottom = (window.innerHeight - panelRect.bottom) < 100;
  if (isNearBottom) {
    body.style.bottom = '100%';
    body.style.top = 'auto';
  } else {
    body.style.top = '100%';
    body.style.bottom = 'auto';
  }
}

// 📦 Восстанавливаем
window.addEventListener('load', () => {
  const x = parseInt(localStorage.getItem('filterPanelX'), 10);
  const y = parseInt(localStorage.getItem('filterPanelY'), 10);
  if (!isNaN(x) && !isNaN(y)) {
    panel.style.left = x + 'px';
    panel.style.top = y + 'px';
    panel.style.bottom = 'auto';
  }
  const expanded = localStorage.getItem('filterPanelExpanded');
  if (expanded === 'false') panel.classList.add('collapsed');
});

// 🔘 Свернуть/развернуть
toggleBtn.addEventListener('click', () => {
  panel.classList.toggle('collapsed');
  savePanelState();

  const header = panel.querySelector('.filter-header');
  if (panel.classList.contains('collapsed')) {
    header.classList.remove('opened');
  } else {
    header.classList.add('opened');
  }
});

  panel.style.bottom = '10px';
  panel.style.top = 'auto';
  panel.classList.remove('collapsed');
  savePanelState();
});

function renderEventList(events) {
  const container = document.getElementById('eventList');
  if (!container) return;

  if (!events.length) {
    container.innerHTML = '<p>Нет событий</p>';
    return;
  }

 container.innerHTML = events.map(ev => `
  <div class="event" style="margin-bottom:6px; cursor:pointer;" data-x="${ev.x}" data-y="${ev.y}">
    <strong>${ev.name || ev.type.toUpperCase()}</strong><br>
    <span style="font-size: 12px;">${ev.description}</span>
  </div>
`).join('');

// ✅ Обработчик клика по событию в списке
container.querySelectorAll('.event').forEach(el => {
  el.addEventListener('click', () => {
    const x = parseInt(el.getAttribute('data-x'));
    const y = parseInt(el.getAttribute('data-y'));
    centerMapOn(x, y);

    // 🔍 Найдём точку-событие
    const match = Array.from(document.querySelectorAll('.event-marker')).find(dot => {
      return Math.round(dot.dataset.x) === Math.round(x) &&
             Math.round(dot.dataset.y) === Math.round(y);
    });

    // 🟡 Симулируем клик после перемещения камеры
    if (match) {
  setTimeout(() => {
    const rect = match.getBoundingClientRect();
    const clickX = rect.left + rect.width / 2;
    const clickY = rect.top + rect.height / 2;

    // 🟡 Симулируем клик и позиционируем тултип внутри
    match.dispatchEvent(new MouseEvent('click', {
      bubbles: true,
      clientX: clickX,
      clientY: clickY
    }));

    // ✅ После того как тултип появился — позиционируем его
    positionTooltip({ clientX: clickX, clientY: clickY });
  }, 600);
}


  });
});

}

function editButton(text, el) {
  const btn = document.createElement('button');
  btn.className = 'edit-btn';
  btn.textContent = '✏️';

  btn.addEventListener('click', () => {
    const textEl = el.querySelector('.chat-text');
    const oldText = textEl.textContent;

    // 🔒 Закрываем popup
    el.querySelector('.chat-message-content .reaction-popup')?.classList.add('hidden');

    // ❌ Удаляем свои реакции
    el.querySelectorAll('.reaction-result .reaction-display').forEach(span => {
      if (span.dataset.user === playerName) {
        const resultBox = span.parentElement;
        const emoji = span.dataset.emoji;
        span.remove();

        const others = [...resultBox.children].filter(s =>
          s.dataset.emoji === emoji && s.dataset.user !== playerName
        );
        const counter = [...resultBox.children].find(s =>
          s.dataset.emoji === emoji && !s.dataset.user
        );

        if (counter) {
          if (others.length === 0) {
            counter.remove();
          } else {
            counter.textContent = `${emoji} ×${others.length}`;
          }
        }
      }
    });

    const textarea = document.createElement('textarea');
    textarea.value = oldText;
    textarea.rows = 2;
    textarea.classList.add('chat-edit-input');

    const saveBtn = document.createElement('button');
    saveBtn.textContent = '💾 Сохранить';

    const undoBtn = document.createElement('button');
    undoBtn.textContent = '↩️ Отменить';
    undoBtn.classList.add('undo-btn');

    const controls = document.createElement('div');
    controls.className = 'chat-edit-controls';
    controls.appendChild(saveBtn);
    controls.appendChild(undoBtn);

    textEl.replaceWith(textarea);
    btn.replaceWith(controls);
    el.classList.add('editing');

    saveBtn.addEventListener('click', () => {
      const newText = textarea.value.trim();
      if (newText) {
        const newSpan = document.createElement('span');
        newSpan.className = 'chat-text edited';
        newSpan.textContent = newText;

        textarea.replaceWith(newSpan);
        controls.replaceWith(editButton(newText, el));
        el.classList.remove('editing'); // ✅ выходим из режима редактирования
      }
    });

    undoBtn.addEventListener('click', () => {
      textarea.replaceWith(textEl);
      controls.replaceWith(btn);
      el.classList.remove('editing');
    });
  });

  return btn;
}








function moveToMapPosition(x, y) {
  const mapWrapper = document.getElementById('mapView');
  if (!mapWrapper) return;

  const offsetX = mapWrapper.offsetWidth / 2;
  const offsetY = mapWrapper.offsetHeight / 2;

  currentTranslateX = -x * currentScale + offsetX;
  currentTranslateY = -y * currentScale + offsetY;

  mapWrapper.style.transition = 'transform 0.4s ease';
  applyTransform();

  // Вернём обратно transition в none после перемещения
  setTimeout(() => {
    mapWrapper.style.transition = 'none';
  }, 400);
}

document.addEventListener("DOMContentLoaded", () => {
  // 🔹 Элементы для чата
  const toggleBtn = document.getElementById("chat-toggle");
  const chatPanel = document.getElementById("world-chat");
  const closeBtn = document.getElementById("chat-close");

  // 🔹 Открытие чата
  toggleBtn.onclick = () => {
    unreadMessages = 0;
    toggleBtn.classList.remove("has-unread");
    toggleBtn.textContent = "💬";
    chatPanel.classList.remove("hidden");
    chatPanel.classList.add("open");
    toggleBtn.classList.add("hidden");
  };

  // 🔹 Закрытие чата
  closeBtn.onclick = () => {
    chatPanel.classList.add("hidden");
    chatPanel.classList.remove("open");
    toggleBtn.classList.remove("hidden");
  };

  // 🔹 Элементы для смайлов
  const emojiToggle = document.getElementById("chat-emoji-btn");
  const emojiPanel = document.getElementById("emoji-panel");
  const emojiButtons = emojiPanel.querySelectorAll("button[data-emoji]");
  const chatInput = document.getElementById("chat-input");

  // 🔹 Переключение панели
  emojiToggle.addEventListener("click", () => {
    console.log("✅ Клик по кнопке смайлов");
    emojiPanel.classList.toggle("hidden");
  });

  // 🔹 Вставка смайлика
  emojiButtons.forEach((button) => {
    button.addEventListener("click", () => {
      const emoji = button.getAttribute("data-emoji");
      const cursorPos = chatInput.selectionStart;
      const textBefore = chatInput.value.substring(0, cursorPos);
      const textAfter = chatInput.value.substring(cursorPos);
      chatInput.value = textBefore + emoji + textAfter;
      chatInput.focus();
      chatInput.selectionStart = chatInput.selectionEnd =
        cursorPos + emoji.length;
    });
  });
});
